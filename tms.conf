{
  # ------------------------------------------------------------
  # TMS configuration
  # ------------------------------------------------------------
  # Secrets and environment-specific values are read from env vars
  # so we never commit real credentials.
  # ------------------------------------------------------------

  hypnotoad => {
    listen => ['http://0.0.0.0:3000'],
    workers => 4,
  },

  secrets => [ $ENV{TMS_SECRET} // 'dev-only-change-me' ],

  # used by Mojolicious::Plugin::Config
  default => {
    app_name    => 'TMS',
    app_version => '0.0.1',

    # placeholders — filled properly in later tasks
    db_url             => $ENV{DATABASE_URL}            // 'postgres://tms:tms@localhost/tms',
    libretranslate_url => $ENV{LIBRETRANSLATE_URL}      // 'http://localhost:5000',
    gemini_api_key     => $ENV{GEMINI_API_KEY},
  },
}
